# Copy this file into .github/workflows/ of a system repository, for example
# .github/workflows/notify-vivarium.yml, through a normal pull request there.
#
# It sends a repository_dispatch to Vidoxlabs/vivarium when main moves, so the
# umbrella can open a pin pull request straight away instead of waiting for the
# scheduled run. With no dispatch token it prints one line and exits cleanly; the
# scheduled bump (every six hours) picks the move up anyway.
name: notify-vivarium

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-vivarium
  cancel-in-progress: true

jobs:
  notify:
    name: notify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send the dispatch to the umbrella
        env:
          VIVARIUM_DISPATCH_TOKEN: ${{ secrets.VIVARIUM_DISPATCH_TOKEN }}
          SYSTEM: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$VIVARIUM_DISPATCH_TOKEN" ]; then
            echo "VIVARIUM_DISPATCH_TOKEN not set; the scheduled bump will pick this up"
            exit 0
          fi
          body=$(printf '{"event_type":"system-updated","client_payload":{"system":"%s","sha":"%s"}}' "$SYSTEM" "$SHA")
          curl --silent --show-error --fail \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $VIVARIUM_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$body" \
            https://api.github.com/repos/Vidoxlabs/vivarium/dispatches
          echo "sent system-updated for $SYSTEM at ${SHA:0:7}"
